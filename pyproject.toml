[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "string-sm-sat"
version = "0.1.0"
description = "Exact bounded heterotic line-bundle research engine"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
numeric = ["numpy", "scipy", "sympy", "psutil"]
dev = ["pytest", "beautifulsoup4"]
[project.scripts]
string-sm-sat = "string_sm_sat.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools.packages.find]
where = ["src"]
